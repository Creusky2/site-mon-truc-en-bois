# Le plan gratuit de Supabase met en pause les projets sans activité pendant plusieurs jours.
# Cette tâche interroge la base deux fois par semaine pour la garder éveillée (aucune donnée n'est lue ni modifiée).
name: "Supabase : garder le projet actif"

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  reveil:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
    steps:
      - name: Petite requête à la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SUPABASE_URL }}/rest/v1/admins?select=user_id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}")
          echo "Réponse : $code"
          [ "$code" = "200" ]
