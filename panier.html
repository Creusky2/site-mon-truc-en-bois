<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panier — Mon Truc en Bois</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=202610191040">
</head>
<body data-sans-contact>
  <header class="entete"></header>

  <main class="conteneur" id="contenu" style="padding-bottom:5rem"></main>

  <footer class="pied"></footer>

  <script src="data/donnees.js"></script>
  <script src="js/demo.js?v=202610191040"></script>
  <script src="js/main.js?v=202610191040"></script>
  <script>
    const { echapper, euros, visuel, lirePanier, ecrirePanier, lienWhatsapp, serveur, appelServeur, modesPaiement, photoLire, photoSupprimer } = MTB;
    const zone = document.getElementById("contenu");
    let modeLivraison = "livraison";
    let paiement = "";
    // Choix de paiement proposés (commandes en ligne reliées au serveur)
    function modesDisponibles() {
      if (!serveur()) return [];
      const m = modesPaiement();
      return [
        m.en_ligne && ["en_ligne", "Payer maintenant par carte", "Paiement sécurisé par Stripe (carte, Apple Pay, Google Pay)."],
        m.apres_validation && ["apres_validation", "Payer après validation de la maquette", "Nous vous envoyons un lien de paiement une fois le rendu validé avec vous."],
        m.boutique && modeLivraison === "retrait" && ["boutique", "Payer à la boutique au retrait", "Carte ou espèces, quand vous venez chercher votre commande."],
      ].filter(Boolean);
    }
    // Retrouve le choix (taille, finition…) à partir de son libellé si le panier date d'une ancienne version
    function indexVariante(l) {
      if (Number.isInteger(l.varianteIndex)) return l.varianteIndex;
      const p = trouverProduit(l.id);
      const i = (p?.variantes?.choix || []).findIndex((c) => l.variante && l.variante.endsWith(": " + c.nom));
      return i >= 0 ? i : 0;
    }
    const cadeau = { emballage: false, message: "", date: "" };
    const emballageActif = SITE.emballage?.actif;
    const prixEmballage = Number(SITE.emballage?.prix || 0);

    // Code promo et montants exacts : calculés par le serveur (les mêmes qu'au paiement)
    let codePromo = "";
    let simulation = null;
    const lignesServeur = (panier) => panier.map((l) => ({ id: l.id, quantite: l.quantite, variante: indexVariante(l) }));
    const signature = (panier) => JSON.stringify([lignesServeur(panier), modeLivraison, cadeau.emballage, codePromo]);
    let minuteurSimulation;
    function simuler() {
      if (!serveur()) return;
      clearTimeout(minuteurSimulation);
      minuteurSimulation = setTimeout(async () => {
        const panier = lirePanier();
        if (!panier.length) return;
        const sig = signature(panier);
        try {
          const r = await appelServeur("commande", { simulation: true, lignes: lignesServeur(panier), mode_reception: modeLivraison, cadeau: { emballage: cadeau.emballage }, code_promo: codePromo });
          simulation = { ...r, sig };
          if (r.erreur_code) codePromo = "";
          afficher();
        } catch {
          simulation = null; // serveur injoignable : on garde le calcul du navigateur
        }
      }, 150);
    }

    const totaux = (panier) => {
      if (simulation && simulation.sig === signature(panier))
        return { sousTotal: simulation.sous_total, port: simulation.port, emballage: simulation.emballage, remise: simulation.remise, total: simulation.total };
      const sousTotal = panier.reduce((t, l) => t + l.prix * l.quantite, 0);
      const port = modeLivraison === "retrait" || sousTotal >= SITE.livraisonOfferteDes ? 0 : Number(SITE.livraison);
      const emballage = emballageActif && cadeau.emballage ? prixEmballage : 0;
      return { sousTotal, port, emballage, remise: 0, total: sousTotal + port + emballage };
    };

    function resumeTexte(panier) {
      const t = totaux(panier);
      const lignes = panier.map((l, i) =>
        [
          `${i + 1}. ${l.nom} × ${l.quantite} — ${euros(l.prix * l.quantite)}`,
          l.variante && `   ${l.variante}`,
          l.texte && `   Texte : « ${l.texte} » (police ${l.police})`,
          l.photoNom && `   Photo : ${l.photoNom} (à joindre / envoyer)`,
          l.remarque && `   Précisions : ${l.remarque}`,
        ].filter(Boolean).join("\n")
      );
      return [
        ...lignes,
        "",
        cadeau.emballage && emballageActif && `Emballage cadeau : ${euros(t.emballage)}`,
        cadeau.message && `Message pour la carte : « ${cadeau.message} »`,
        cadeau.date && `Date souhaitée : ${new Date(cadeau.date).toLocaleDateString("fr-FR")}`,
        `Sous-total : ${euros(t.sousTotal)}`,
        `${modeLivraison === "retrait" ? "Retrait à la boutique d'Auchel" : "Livraison"} : ${t.port ? euros(t.port) : "offerte"}`,
        `TOTAL : ${euros(t.total)}`,
      ].filter((x) => x !== false && x !== "").join("\n");
    }

    function afficher() {
      // Conserve ce que le client a déjà saisi quand la page se redessine
      const saisies = {};
      zone.querySelectorAll("#commande input, #commande textarea").forEach((el) => (saisies[el.id] = el.type === "checkbox" ? el.checked : el.value));
      dessiner();
      for (const [id, v] of Object.entries(saisies)) {
        const el = document.getElementById(id);
        if (!el || id === "c-emballage") continue;
        if (el.type === "checkbox") el.checked = v;
        else el.value = v;
      }
    }

    function dessiner() {
      const panier = lirePanier();
      if (!panier.length) {
        zone.innerHTML = `<div class="vide"><h1>Votre panier est vide</h1><p class="chapeau">Découvrez nos créations personnalisables.</p><a class="btn" href="boutique.html">Aller à la boutique</a></div>`;
        return;
      }
      const t = totaux(panier);
      const restant = SITE.livraisonOfferteDes - t.sousTotal;
      zone.innerHTML = `
        <div class="page-tete"><h1>Mon panier</h1></div>
        <div class="panier-grille">
          <div>
            <div class="lignes">
              ${panier.map((l) => {
                const p = trouverProduit(l.id) || { nom: l.nom, image: "" };
                return `
                <div class="ligne-panier" data-uid="${echapper(l.uid)}">
                  <div class="vignette">${l.photo ? `<img src="${l.photo}" alt="Votre photo">` : visuel(p)}</div>
                  <div>
                    <h3><a href="produit.html?id=${encodeURIComponent(l.id)}">${echapper(l.nom)}</a></h3>
                    <ul>
                      ${l.variante ? `<li>${echapper(l.variante)}</li>` : ""}
                      ${l.texte ? `<li>Texte : « ${echapper(l.texte)} » — ${echapper(l.police)}</li>` : ""}
                      ${l.photoNom ? `<li>Photo : ${echapper(l.photoNom)}</li>` : ""}
                      ${l.remarque ? `<li>Précisions : ${echapper(l.remarque)}</li>` : ""}
                    </ul>
                  </div>
                  <div class="ligne-actions">
                    <strong class="prix">${euros(l.prix * l.quantite)}</strong>
                    <input type="number" min="1" max="99" value="${l.quantite}" data-qte aria-label="Quantité">
                    <button class="supprimer" data-suppr>Retirer</button>
                  </div>
                </div>`;
              }).join("")}
            </div>
            <p style="margin-top:1.25rem"><a class="lien-fleche" href="boutique.html">← Continuer mes achats</a></p>
          </div>

          <div class="recap">
            <h2 style="font-size:1.35rem">Récapitulatif</h2>
            <div class="champ">
              <span class="label">Mode de réception</span>
              <label class="case"><input type="radio" name="mode" value="livraison" ${modeLivraison === "livraison" ? "checked" : ""}> Livraison à domicile</label>
              <label class="case"><input type="radio" name="mode" value="retrait" ${modeLivraison === "retrait" ? "checked" : ""}> Retrait à la boutique d'Auchel (gratuit)</label>
            </div>
            <div class="pile" style="gap:.5rem">
              <div class="recap-ligne"><span>Sous-total</span><span>${euros(t.sousTotal)}</span></div>
              <div class="recap-ligne"><span>${modeLivraison === "retrait" ? "Retrait" : "Livraison"}</span><span>${t.port ? euros(t.port) : "Offert"}</span></div>
              ${modeLivraison === "livraison" && restant > 0 ? `<p class="aide">Plus que <strong>${euros(restant)}</strong> pour la livraison offerte.</p><div class="jauge" aria-hidden="true"><span style="width:${Math.min(100, (t.sousTotal / SITE.livraisonOfferteDes) * 100)}%"></span></div>` : ""}
              ${t.emballage ? `<div class="recap-ligne"><span>Emballage cadeau</span><span>${euros(t.emballage)}</span></div>` : ""}
              ${t.remise ? `<div class="recap-ligne recap-remise"><span>Code ${echapper(simulation.code_promo)}${simulation.promo_description ? ` — ${echapper(simulation.promo_description)}` : ""} <button type="button" class="supprimer" id="retirer-code">Retirer</button></span><span>−${euros(t.remise)}</span></div>` : ""}
              <div class="recap-ligne recap-total"><span>Total</span><span>${euros(t.total)}</span></div>
              ${serveur() && !t.remise ? `
              <div class="champ">
                <label for="c-code">Code promo</label>
                <div class="code-promo"><input type="text" id="c-code" placeholder="Ex. BIENVENUE10" autocomplete="off" maxlength="30"><button type="button" class="btn btn-ligne" id="appliquer-code">Appliquer</button></div>
                ${simulation?.erreur_code ? `<p class="message message-alerte" style="margin-top:.5rem">${echapper(simulation.erreur_code)}</p>` : ""}
              </div>` : ""}
            </div>

            <form id="commande" class="pile" style="gap:1rem">
              <h3>Vos coordonnées</h3>
              <div class="champ"><label for="c-nom">Nom et prénom *</label><input type="text" id="c-nom" name="nom" required autocomplete="name"></div>
              <div class="deux-champs">
                <div class="champ"><label for="c-email">Email *</label><input type="email" id="c-email" name="email" required autocomplete="email"></div>
                <div class="champ"><label for="c-tel">Téléphone *</label><input type="tel" id="c-tel" name="telephone" required autocomplete="tel"></div>
              </div>
              ${modeLivraison === "livraison" ? `<div class="champ"><label for="c-adr">Adresse de livraison *</label><textarea id="c-adr" name="adresse" required autocomplete="street-address" style="min-height:80px"></textarea></div>` : ""}
              <div class="options-cadeau">
                <span class="label" style="display:flex;gap:.5rem;align-items:center">${MTB.icone("cadeau")} C'est pour offrir ?</span>
                ${emballageActif ? `<label class="case"><input type="checkbox" id="c-emballage" ${cadeau.emballage ? "checked" : ""}> Emballage cadeau (+${euros(prixEmballage)})</label>` : ""}
                <div class="champ"><label for="c-carte">Message pour la carte <small>(facultatif)</small></label><input type="text" id="c-carte" maxlength="160" value="${echapper(cadeau.message)}" placeholder="Joyeux anniversaire Mamie !"></div>
                <div class="champ"><label for="c-date">Pour quelle date ? <small>(facultatif)</small></label><input type="date" id="c-date" value="${echapper(cadeau.date)}" min="${new Date().toISOString().slice(0, 10)}"></div>
              </div>
              <div class="champ"><label for="c-msg">Message <small>(occasion, question…)</small></label><textarea id="c-msg" name="message" style="min-height:70px"></textarea></div>
              ${(() => {
                const modes = modesDisponibles();
                if (!modes.length) return "";
                if (!modes.some(([v]) => v === paiement)) paiement = modes[0][0];
                return `<div class="champ"><span class="label">Paiement</span>${modes
                  .map(([v, titre, aide]) => `<label class="case"><input type="radio" name="paiement" value="${v}" ${v === paiement ? "checked" : ""}> <span><strong>${titre}</strong><br><small class="aide">${aide}</small></span></label>`)
                  .join("")}</div>`;
              })()}
              ${serveur() ? `<label class="case"><input type="checkbox" id="c-nouveautes"> <span>Je souhaite recevoir les nouveautés et idées cadeaux par email <small class="aide">(quelques emails par an, désinscription en un clic)</small></span></label>` : ""}
              <label class="case"><input type="checkbox" id="c-cgv" required> <span>J'accepte les <a href="cgv.html" target="_blank">conditions générales de vente</a> *</span></label>
              <button class="btn btn-plein" type="submit" data-canal="email">${serveur() && paiement === "en_ligne" ? `${MTB.icone("cadeau")} Payer ${euros(t.total)}` : "Envoyer ma commande"}</button>
              ${lienWhatsapp() ? `<div class="ou">ou</div><button class="btn btn-plein btn-whatsapp" type="submit" data-canal="whatsapp">${MTB.icone("bulle")} Commander par WhatsApp</button>` : ""}
              <div id="envoi-etat" aria-live="polite"></div>
              <p class="aide">${serveur()
                ? "Vous recevez une confirmation par email avec un lien pour suivre votre commande. Nous vous recontactons pour valider la personnalisation (maquette si besoin) avant fabrication."
                : "Nous vous recontactons sous 48 h pour valider la personnalisation (maquette si besoin) et vous indiquer les modalités de paiement. Aucun paiement n'est demandé à cette étape."}</p>
            </form>
          </div>
        </div>`;
    }

    zone.addEventListener("input", (e) => {
      if (e.target.id === "c-carte") cadeau.message = e.target.value.trim();
      if (e.target.id === "c-date") cadeau.date = e.target.value;
    });
    zone.addEventListener("change", (e) => {
      if (e.target.id === "c-emballage") {
        cadeau.emballage = e.target.checked;
        afficher();
        simuler();
      }
      if (e.target.name === "mode") {
        modeLivraison = e.target.value;
        afficher();
        simuler();
      }
      if (e.target.name === "paiement") {
        paiement = e.target.value;
        afficher();
      }
      if (e.target.matches("[data-qte]")) {
        const uid = e.target.closest("[data-uid]").dataset.uid;
        const q = Math.min(99, Math.max(1, parseInt(e.target.value, 10) || 1));
        ecrirePanier(lirePanier().map((l) => (l.uid === uid ? { ...l, quantite: q } : l)));
        afficher();
        simuler();
      }
    });
    zone.addEventListener("keydown", (e) => {
      if (e.target.id === "c-code" && e.key === "Enter") {
        e.preventDefault();
        document.getElementById("appliquer-code").click();
      }
    });
    zone.addEventListener("click", (e) => {
      if (e.target.id === "appliquer-code") {
        codePromo = document.getElementById("c-code").value.trim().toUpperCase();
        if (codePromo) simuler();
        return;
      }
      if (e.target.id === "retirer-code") {
        codePromo = "";
        simulation = null;
        afficher();
        simuler();
        return;
      }
      if (!e.target.matches("[data-suppr]")) return;
      const uid = e.target.closest("[data-uid]").dataset.uid;
      lirePanier().filter((l) => l.uid === uid && l.photoCle).forEach((l) => photoSupprimer(l.photoCle));
      ecrirePanier(lirePanier().filter((l) => l.uid !== uid));
      afficher();
      simuler();
    });

    zone.addEventListener("submit", async (e) => {
      if (e.target.id !== "commande") return;
      e.preventDefault();
      const f = e.target;
      const panier = lirePanier();
      const numero = "CMD-" + new Date().toISOString().slice(2, 10).replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
      const client = {
        nom: f.nom.value.trim(),
        email: f.email.value.trim(),
        telephone: f.telephone.value.trim(),
        adresse: f.adresse ? f.adresse.value.trim() : "Retrait à la boutique d'Auchel",
        message: f.message.value.trim(),
      };
      const corps = [
        `Commande ${numero}`,
        "",
        `Client : ${client.nom}`,
        `Email : ${client.email}`,
        `Téléphone : ${client.telephone}`,
        `Adresse : ${client.adresse}`,
        client.message && `Message : ${client.message}`,
        "",
        "--- Détail ---",
        resumeTexte(panier),
      ].filter((x) => x !== "").join("\n");
      const aDesPhotos = panier.some((l) => l.photoNom);
      f.querySelectorAll("button").forEach((b) => (b.disabled = true));
      const parWhatsapp = e.submitter?.dataset.canal === "whatsapp";
      if (serveur() && !parWhatsapp) return envoyerAuServeur(f, panier, client);

      let envoye = false;
      if (parWhatsapp) {
        window.open(lienWhatsapp(corps), "_blank", "noopener");
        envoye = "whatsapp";
      } else if (SITE.formulaireCommande) {
        try {
          const r = await fetch(SITE.formulaireCommande, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ _subject: `Nouvelle commande ${numero}`, _replyto: client.email, numero, ...client, commande: corps }),
          });
          envoye = r.ok;
        } catch {}
      }
      if (envoye === false) {
        // Repli : ouverture de la messagerie du client avec la commande pré-remplie.
        location.href = `mailto:${SITE.email}?subject=${encodeURIComponent("Commande " + numero)}&body=${encodeURIComponent(corps)}`;
      }

      ecrirePanier([]);
      zone.innerHTML = `
        <div class="vide">
          <h1>Merci ${echapper(client.nom.split(" ")[0])} !</h1>
          <p class="chapeau">Votre commande <strong>${numero}</strong> ${envoye === "whatsapp" ? "est prête dans WhatsApp : pensez à envoyer le message" : envoye ? "a bien été envoyée" : "est prête dans votre messagerie : pensez à cliquer sur « Envoyer »"}. Nous vous recontactons très vite pour valider votre personnalisation et le paiement.</p>
          ${aDesPhotos ? `<p class="message">N'oubliez pas de nous envoyer vos photos en haute qualité à <a href="mailto:${echapper(SITE.email)}?subject=${encodeURIComponent("Photos commande " + numero)}">${echapper(SITE.email)}</a> en indiquant le numéro de commande.</p>` : ""}
          <a class="btn" href="index.html">Retour à l'accueil</a>
        </div>`;
      scrollTo(0, 0);
    });

    // ---------- Commande enregistrée sur le serveur (paiement, photos, suivi) ----------
    const dataUrlVersBlob = async (u) => (await fetch(u)).blob();
    async function envoyerAuServeur(f, panier, client) {
      const etat = document.getElementById("envoi-etat");
      const dire = (t, alerte = false) => (etat.innerHTML = `<p class="message${alerte ? " message-alerte" : ""}">${t}</p>`);
      dire("Envoi de votre commande…");
      try {
        const r = await appelServeur("commande", {
          client: { nom: client.nom, email: client.email, tel: client.telephone, adresse: f.adresse ? client.adresse : "" },
          mode_reception: modeLivraison,
          lignes: panier.map((l) => ({
            id: l.id,
            quantite: l.quantite,
            variante: indexVariante(l),
            texte: l.texte,
            police: l.police,
            remarque: l.remarque,
            photo: l.photoNom ? { nom: l.photoNom.replace(/\.[^.]+$/, "") + ".jpg", type: "image/jpeg" } : null,
          })),
          cadeau: { emballage: cadeau.emballage, message: cadeau.message, date: cadeau.date },
          message: client.message,
          paiement_mode: paiement || "apres_validation",
          code_promo: codePromo,
          consentement_marketing: !!document.getElementById("c-nouveautes")?.checked,
          retour: new URL("suivi.html", location.href).href,
        });
        // Photos : la version haute qualité gardée dans le navigateur, sinon l'aperçu
        let photosRatees = 0;
        for (const [n, envoi] of r.envois_photos.entries()) {
          dire(`Envoi des photos (${n + 1}/${r.envois_photos.length})…`);
          const l = panier[envoi.ligne];
          const blob = (l.photoCle && (await photoLire(l.photoCle))) || (l.photo && (await dataUrlVersBlob(l.photo)));
          try {
            if (!blob) throw new Error("photo absente");
            const rep = await fetch(envoi.url, { method: "PUT", headers: { "Content-Type": "image/jpeg" }, body: blob });
            if (!rep.ok) throw new Error(rep.status);
          } catch {
            photosRatees++;
          }
        }
        panier.forEach((l) => l.photoCle && photoSupprimer(l.photoCle));
        ecrirePanier([]);
        MTB.mesurer("commande");
        const suite = new URL("suivi.html", location.href);
        suite.searchParams.set("jeton", r.jeton);
        suite.searchParams.set("merci", "1");
        if (photosRatees) suite.searchParams.set("photos", "a-envoyer");
        location.href = r.paiement_url || suite.href;
      } catch (err) {
        dire(`${echapper(err.message)} Vous pouvez aussi nous appeler au ${echapper(SITE.telephone)}.`, true);
        f.querySelectorAll("button").forEach((b) => (b.disabled = false));
      }
    }

    afficher();
    simuler();
  </script>
</body>
</html>
